name: Diagnose Myriad TFT Wiring
on:
  push:
    branches: [ myriad-safe4-build ]
    paths: [ '.github/workflows/myriad-tft-diagnostic.yml' ]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Myriad Arduino settings screenshot
        run: |
          curl -L --fail --retry 3 -o myriad_arduino_settings.png 'https://github.com/user-attachments/assets/81c5da8a-f282-4116-b620-a2a86a6cb852'
          file myriad_arduino_settings.png
          ls -lh myriad_arduino_settings.png
      - name: Upload settings screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Myriad-official-Arduino-settings
          path: myriad_arduino_settings.png
          if-no-files-found: error
