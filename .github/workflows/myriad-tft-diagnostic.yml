name: Diagnose Myriad Build Settings
on:
  push:
    branches: [ myriad-safe4-build ]
    paths: [ '.github/workflows/myriad-tft-diagnostic.yml' ]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install exact RP2040 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040@6.0.0
      - name: Print Generic RP2040 board options
        run: |
          arduino-cli board details -b rp2040:rp2040:generic --full | tee generic-board-details.txt
          grep -Ei 'Boot Stage|Flash Size|CPU Speed|Optimize|USB Stack|Exception|RTTI|Debug|Profil|Stack Protector|IP/Bluetooth' generic-board-details.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: generic-rp2040-board-details
          path: generic-board-details.txt
          if-no-files-found: error
