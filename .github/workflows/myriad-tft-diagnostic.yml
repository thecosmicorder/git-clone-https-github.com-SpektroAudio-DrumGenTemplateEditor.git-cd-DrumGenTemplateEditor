name: Diagnose Myriad TFT Wiring

on:
  push:
    branches: [ myriad-safe4-build ]
    paths: [ '.github/workflows/myriad-tft-diagnostic.yml' ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone Myriad 1.1.2
        run: git clone --branch 1.1.2 https://github.com/Emute-Lab-Instruments/Myriad.git Myriad
      - name: Extract TFT and processor pad net mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Myriad/hardware/myriad_0.5/myriad_0.5.kicad_pcb').read_text(errors='ignore')
          lines=p.splitlines()
          def blocks_starting(marker):
              for i,l in enumerate(lines):
                  if marker in l and '(footprint ' in l:
                      depth=0; out=[]; started=False
                      for x in lines[i:]:
                          out.append(x)
                          depth += x.count('(')-x.count(')')
                          started=True
                          if started and depth==0: break
                      yield i+1,out
          for marker in ['Round TFT 240x240','PinSocket_1x35_P2.54mm_Vertical']:
              print('\n===',marker,'===')
              for ln,b in blocks_starting(marker):
                  text='\n'.join(b)
                  ref=re.search(r'\(property "Reference" "([^"]+)"',text)
                  val=re.search(r'\(property "Value" "([^"]+)"',text)
                  print('BLOCK line',ln,'REF',ref.group(1) if ref else '?','VAL',val.group(1) if val else '?')
                  # Collect each pad start through its local closing level and show number/net.
                  for j,x in enumerate(b):
                      m=re.match(r'\s*\(pad "?([^" ]+)"?',x)
                      if not m: continue
                      pad=m.group(1); d=0; chunk=[]
                      for y in b[j:]:
                          chunk.append(y); d+=y.count('(')-y.count(')')
                          if d==0: break
                      t=' '.join(chunk)
                      nm=re.search(r'\(net\s+\d+\s+"([^"]*)"\)',t)
                      if nm: print('PAD',pad,'NET',nm.group(1))
          PY
