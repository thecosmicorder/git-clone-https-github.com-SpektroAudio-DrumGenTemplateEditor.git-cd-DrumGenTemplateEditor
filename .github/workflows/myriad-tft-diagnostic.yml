name: Diagnose Myriad TFT Wiring
on:
  push:
    branches: [ myriad-safe4-build ]
    paths: [ '.github/workflows/myriad-tft-diagnostic.yml' ]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --branch 1.1.2 https://github.com/Emute-Lab-Instruments/Myriad.git Myriad
      - name: Extract ELI2040 pin names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Myriad/hardware/myriad_0.5/myriad_0.5.kicad_sch').read_text(errors='ignore')
          start=s.index('(symbol "emutelab:ELI2040_C"')
          # balanced symbol block
          d=0; end=None
          for i,ch in enumerate(s[start:],start):
              if ch=='(': d+=1
              elif ch==')':
                  d-=1
                  if d==0: end=i+1; break
          b=s[start:end]
          # balanced pin blocks and their name/number
          pos=0
          while True:
              k=b.find('(pin ',pos)
              if k<0: break
              d=0; e=None
              for j,ch in enumerate(b[k:],k):
                  if ch=='(': d+=1
                  elif ch==')':
                      d-=1
                      if d==0: e=j+1; break
              pb=b[k:e]
              nm=re.search(r'\(name "([^"]+)"',pb)
              no=re.search(r'\(number "([^"]+)"',pb)
              at=re.search(r'\(at ([^\)]+)\)',pb)
              if nm and no: print('HEADER',no.group(1),'NAME',nm.group(1),'AT',at.group(1) if at else '?')
              pos=e
          PY
