name: Build Myriad Stock Control 5.4.2 C++20

on:
  push:
    branches: [ myriad-safe4-build ]
    paths: [ '.github/workflows/myriad-stock-control-542-cxx20.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MYRIAD_FQBN: rp2040:rp2040:generic:flash=16777216_14680064,freq=200,opt=Optimize3,os=none,profile=Disabled,rtti=Disabled,stackprotect=Disabled,exceptions=Disabled,dbgport=Disabled,dbglvl=None,boot2=boot2_w25q080_2_padded_checksum,usbstack=picosdk,ipbtstack=ipv4only,uploadmethod=default
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install factory core 5.4.2
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040@5.4.2
          arduino-cli lib install 'ArduinoJson@7.4.3'
          arduino-cli core list | tee CORE_LIST.txt
      - name: Clone exact Myriad 1.1.2
        run: |
          git clone --depth 1 --branch 1.1.2 https://github.com/Emute-Lab-Instruments/Myriad.git Myriad
          test "$(grep -m1 '#define MYRIAD_VERSION' Myriad/Myriad_A/Myriad_A.ino)" = '#define MYRIAD_VERSION "1.1.2"'
          grep -q 'N_OSCILLATOR_MODELS = 13;' Myriad/arduino_libmyriad/oscillatorModels.hpp
      - name: Restore exact memlp commit and published-source compatibility shim
        run: |
          rm -rf Myriad/Myriad_A/src/memlp
          git clone https://github.com/MusicallyEmbodiedML/memlp.git Myriad/Myriad_A/src/memlp
          git -C Myriad/Myriad_A/src/memlp checkout b5a63e8f70b22c0fcdcc4175ba8447ef91512d21
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Myriad/Myriad_A/src/memlp/Utils.h'); s=p.read_text()
          assert 'enum ACTIVATION_FUNCTIONS {SIGMOID, TANH, LINEAR, RELU};' in s
          s=s.replace('enum ACTIVATION_FUNCTIONS {SIGMOID, TANH, LINEAR, RELU};','enum ACTIVATION_FUNCTIONS {SIGMOID, TANH, LINEAR, RELU, HARDSIGMOID};')
          marker='//Compute hyperbolic tangent (tanh)\n'; assert marker in s
          hard='''template<typename T>\nMLP_ACTIVATION_FN\ninline T hardsigmoid(T x) { T y=static_cast<T>(0.2)*x+static_cast<T>(0.5); if(y<static_cast<T>(0))return static_cast<T>(0); if(y>static_cast<T>(1))return static_cast<T>(1); return y; }\ntemplate<typename T>\nMLP_ACTIVATION_FN\ninline T deriv_hardsigmoid(T x) { return (x>static_cast<T>(-2.5)&&x<static_cast<T>(2.5))?static_cast<T>(0.2):static_cast<T>(0); }\n\n'''
          s=s.replace(marker,hard+marker)
          reg='    AddNewPair(ACTIVATION_FUNCTIONS::RELU, &relu<T>, &deriv_relu<T>);'; assert reg in s
          s=s.replace(reg,reg+'\n    AddNewPair(ACTIVATION_FUNCTIONS::HARDSIGMOID, &hardsigmoid<T>, &deriv_hardsigmoid<T>);')
          p.write_text(s)
          PY
      - name: Install hardware-proven TFT setup
        run: |
          git clone https://github.com/Emute-Lab-Instruments/TFT_eSPI.git TFT_eSPI
          git -C TFT_eSPI rev-parse HEAD | tee TFT_COMMIT.txt
          cat > TFT_eSPI/User_Setups/Setup303_RP2040_GC9A01.h <<'EOF'
          #define USER_SETUP_ID 303
          #define GC9A01_DRIVER
          #define TFT_WIDTH 240
          #define TFT_HEIGHT 240
          #define TFT_MOSI 3
          #define TFT_SCLK 2
          #define TFT_CS 20
          #define TFT_DC 18
          #define TFT_RST 19
          #define TFT_BL 17
          #define TFT_BACKLIGHT_ON HIGH
          #define LOAD_GLCD
          #define LOAD_FONT2
          #define LOAD_FONT4
          #define LOAD_FONT6
          #define LOAD_FONT7
          #define LOAD_FONT8
          #define LOAD_GFXFF
          #define SMOOTH_FONT
          #define SPI_FREQUENCY 40000000
          #define SPI_READ_FREQUENCY 20000000
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TFT_eSPI/User_Setup_Select.h'); s=p.read_text()
          line='#include <User_Setup.h>           // Default setup is root library folder'; assert line in s
          p.write_text(s.replace(line,'//#include <User_Setup.h>\n#include <User_Setups/Setup303_RP2040_GC9A01.h>'))
          PY
          mkdir -p "$HOME/Arduino/libraries"
          ln -s "$GITHUB_WORKSPACE/Myriad/arduino_libmyriad" "$HOME/Arduino/libraries/arduino_libmyriad"
          ln -s "$GITHUB_WORKSPACE/TFT_eSPI" "$HOME/Arduino/libraries/TFT_eSPI"
      - name: Assert zero custom oscillator code
        run: |
          grep -q 'N_OSCILLATOR_MODELS = 13;' Myriad/arduino_libmyriad/oscillatorModels.hpp
          ! grep -R -q 'safe4\|SAFE4\|safe11\|SAFE28' Myriad/arduino_libmyriad Myriad/Myriad_A Myriad/Myriad_B
      - name: Compile stock A core 5.4.2 C++20
        run: |
          mkdir -p out-A
          arduino-cli compile --clean --fqbn "$MYRIAD_FQBN" --build-property 'compiler.cpp.extra_flags=-std=gnu++20' --output-dir "$GITHUB_WORKSPACE/out-A" Myriad/Myriad_A 2>&1 | tee out-A/compile.log
          test -s out-A/Myriad_A.ino.uf2
          cp out-A/Myriad_A.ino.uf2 out-A/Myriad_A_STOCK_542_CXX20_CONTROL.uf2
          sha256sum out-A/Myriad_A_STOCK_542_CXX20_CONTROL.uf2 | tee out-A/SHA256.txt
          grep -E 'Sketch uses|Global variables use' out-A/compile.log | tee out-A/MEMORY.txt || true
      - name: Compile stock B core 5.4.2 C++20
        run: |
          mkdir -p out-B
          arduino-cli compile --clean --fqbn "$MYRIAD_FQBN" --build-property 'compiler.cpp.extra_flags=-std=gnu++20' --output-dir "$GITHUB_WORKSPACE/out-B" Myriad/Myriad_B 2>&1 | tee out-B/compile.log
          test -s out-B/Myriad_B.ino.uf2
          cp out-B/Myriad_B.ino.uf2 out-B/Myriad_B_STOCK_542_CXX20_CONTROL.uf2
          sha256sum out-B/Myriad_B_STOCK_542_CXX20_CONTROL.uf2 | tee out-B/SHA256.txt
          grep -E 'Sketch uses|Global variables use' out-B/compile.log | tee out-B/MEMORY.txt || true
      - name: Compare with official 1.1.2 binary sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('out-A/Myriad_A_STOCK_542_CXX20_CONTROL.uf2').stat().st_size
          b=Path('out-B/Myriad_B_STOCK_542_CXX20_CONTROL.uf2').stat().st_size
          with open('CONTROL_MANIFEST.txt','w') as f:
              f.write('STOCK 1.1.2 CONTROL - core 5.4.2 + C++20\n')
              f.write('No custom oscillator code. N_OSCILLATOR_MODELS=13.\n')
              f.write(f'A size {a}; official 1472000; delta {a-1472000}\n')
              f.write(f'B size {b}; official 290304; delta {b-290304}\n')
              f.write('Purpose: hardware audio A/B test against official factory 1.1.2 before any custom DSP is reintroduced.\n')
          print(Path('CONTROL_MANIFEST.txt').read_text())
          PY
          strings -a out-A/Myriad_A_STOCK_542_CXX20_CONTROL.uf2 | grep -m3 -E 'rp2040/5\.4\.2|Pico SDK|Arduino' > out-A/METADATA.txt || true
          strings -a out-B/Myriad_B_STOCK_542_CXX20_CONTROL.uf2 | grep -m3 -E 'rp2040/5\.4\.2|Pico SDK|Arduino' > out-B/METADATA.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: Myriad-stock-542-cxx20-control-pair
          path: |
            out-A/Myriad_A_STOCK_542_CXX20_CONTROL.uf2
            out-B/Myriad_B_STOCK_542_CXX20_CONTROL.uf2
            out-A/SHA256.txt
            out-B/SHA256.txt
            out-A/MEMORY.txt
            out-B/MEMORY.txt
            out-A/METADATA.txt
            out-B/METADATA.txt
            CONTROL_MANIFEST.txt
            CORE_LIST.txt
            TFT_COMMIT.txt
          if-no-files-found: error
