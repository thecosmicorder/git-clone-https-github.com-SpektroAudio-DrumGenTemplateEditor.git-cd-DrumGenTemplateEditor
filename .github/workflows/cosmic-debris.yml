name: Build Aurora Cosmic Debris

on:
  push:
    branches: [ main ]
    paths:
      - 'AuroraCosmicDebris/**'
      - '.github/workflows/cosmic-debris.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git

      - name: Clone Aurora SDK
        run: |
          git clone https://github.com/Qu-Bit-Electronix/Aurora-SDK --recurse-submodules Aurora-SDK
          cd Aurora-SDK
          git submodule update --init --recursive
          ./ci/build_libs.sh

      - name: Build Cosmic Debris
        working-directory: AuroraCosmicDebris
        run: |
          make AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK"

      - name: Verify binary
        run: |
          test -s AuroraCosmicDebris/build/AuroraCosmicDebris.bin
          ls -lh AuroraCosmicDebris/build/AuroraCosmicDebris.bin
          sha256sum AuroraCosmicDebris/build/AuroraCosmicDebris.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Cosmic-Debris-v1.0
          path: AuroraCosmicDebris/build/AuroraCosmicDebris.bin
          if-no-files-found: error
