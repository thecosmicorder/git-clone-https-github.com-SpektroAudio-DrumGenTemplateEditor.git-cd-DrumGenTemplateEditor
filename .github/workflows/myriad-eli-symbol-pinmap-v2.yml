name: Extract Exact ELI2040 Pinmap
on:
  push:
    branches: [ myriad-safe4-build ]
    paths: [ '.github/workflows/myriad-eli-symbol-pinmap-v2.yml' ]
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch 1.1.2 https://github.com/Emute-Lab-Instruments/Myriad.git Myriad
      - name: Extract ELI2040_C library symbol
        run: |
          python3 - <<'PY' | tee pinmap-v2.txt
          from pathlib import Path
          import re
          s=Path('Myriad/hardware/myriad_0.5/myriad_0.5.kicad_sch').read_text(errors='ignore')
          pat='(symbol "emutelab:ELI2040_C"'
          i=s.find(pat)
          print('index',i)
          assert i>=0
          d=0;q=False;esc=False;j=i
          while j<len(s):
            c=s[j]
            if q:
              if esc: esc=False
              elif c=='\\': esc=True
              elif c=='"': q=False
            else:
              if c=='"': q=True
              elif c=='(': d+=1
              elif c==')':
                d-=1
                if d==0: break
            j+=1
          b=s[i:j+1]
          print(b.splitlines()[0])
          for pm in re.finditer(r'\(pin\s+[^\n]+.*?\(name\s+"([^"]+)".*?\(number\s+"([^"]+)"',b,re.S):
            print(f'{pm.group(2)}={pm.group(1)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: myriad-eli-pinmap-v2
          path: pinmap-v2.txt
