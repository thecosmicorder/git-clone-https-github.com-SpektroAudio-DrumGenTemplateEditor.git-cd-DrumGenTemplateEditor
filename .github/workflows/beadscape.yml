name: Build Aurora Beadscape

on:
  push:
    branches: [ main ]
    paths:
      - 'AuroraBeadscape/**'
      - '.github/workflows/beadscape.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git

      - name: Clone Aurora SDK
        run: |
          git clone https://github.com/Qu-Bit-Electronix/Aurora-SDK --recurse-submodules Aurora-SDK
          cd Aurora-SDK
          git submodule update --init --recursive
          ./ci/build_libs.sh

      - name: Build Beadscape
        working-directory: AuroraBeadscape
        run: make AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK"

      - name: Verify binary
        run: |
          test -s AuroraBeadscape/build/AuroraBeadscape.bin
          file AuroraBeadscape/build/AuroraBeadscape.bin
          ls -lh AuroraBeadscape/build/AuroraBeadscape.bin
          sha256sum AuroraBeadscape/build/AuroraBeadscape.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraBeadscape-v1.0
          path: AuroraBeadscape/build/AuroraBeadscape.bin
          if-no-files-found: error
