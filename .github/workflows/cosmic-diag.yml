name: Build Aurora Cosmic Diagnostic

on:
  push:
    branches: [ main ]
    paths:
      - 'AuroraCosmicDiag/**'
      - '.github/workflows/cosmic-diag.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git
      - name: Clone Aurora SDK
        run: |
          git clone https://github.com/Qu-Bit-Electronix/Aurora-SDK --recurse-submodules Aurora-SDK
          cd Aurora-SDK
          git submodule update --init --recursive
          ./ci/build_libs.sh
      - name: Build diagnostic
        working-directory: AuroraCosmicDiag
        run: |
          make AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK"
          test -s build/AuroraCosmicDiag.bin
      - name: Verify binary
        run: |
          ls -lh AuroraCosmicDiag/build/AuroraCosmicDiag.bin
          sha256sum AuroraCosmicDiag/build/AuroraCosmicDiag.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Cosmic-Diagnostic
          path: AuroraCosmicDiag/build/AuroraCosmicDiag.bin
          if-no-files-found: error
