name: Build Aurora EchoGarden

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EchoGarden
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git python3

      - name: Clone Aurora SDK
        run: |
          git clone https://github.com/Qu-Bit-Electronix/Aurora-SDK --recurse-submodules Aurora-SDK
          cd Aurora-SDK
          git submodule update --init --recursive
          ./ci/build_libs.sh

      - name: Build EchoGarden
        run: make AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK"

      - name: Verify binary
        run: |
          test -f build/AuroraEchoGarden.bin
          file build/AuroraEchoGarden.bin
          ls -lh build/AuroraEchoGarden.bin
          sha256sum build/AuroraEchoGarden.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraEchoGarden-firmware
          path: build/AuroraEchoGarden.bin
          if-no-files-found: error
