name: Build Aurora Cosmic Debris v2

on:
  push:
    branches: [ main ]
    paths:
      - 'AuroraCosmicDebrisV2/**'
      - '.github/workflows/cosmic-debris-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git

      - name: Clone Aurora SDK
        run: |
          git clone https://github.com/Qu-Bit-Electronix/Aurora-SDK --recurse-submodules Aurora-SDK
          cd Aurora-SDK
          git submodule update --init --recursive
          ./ci/build_libs.sh

      - name: Build Cosmic Debris v2
        working-directory: AuroraCosmicDebrisV2
        run: |
          make AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK"
          test -s build/AuroraCosmicDebrisV2.bin

      - name: Verify binary
        run: |
          ls -lh AuroraCosmicDebrisV2/build/AuroraCosmicDebrisV2.bin
          file AuroraCosmicDebrisV2/build/AuroraCosmicDebrisV2.bin
          sha256sum AuroraCosmicDebrisV2/build/AuroraCosmicDebrisV2.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Cosmic-Debris-v2
          path: AuroraCosmicDebrisV2/build/AuroraCosmicDebrisV2.bin
          if-no-files-found: error
