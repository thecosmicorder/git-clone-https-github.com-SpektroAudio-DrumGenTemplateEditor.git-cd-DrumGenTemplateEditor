name: Build Aurora Cloudscape

on:
  push:
    branches: [ main ]
    paths:
      - 'AuroraCloudscape/**'
      - '.github/workflows/cloudscape.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git python3

      - name: Clone Aurora SDK
        run: |
          git clone https://github.com/Qu-Bit-Electronix/Aurora-SDK --recurse-submodules Aurora-SDK
          cd Aurora-SDK
          git submodule update --init --recursive
          ./ci/build_libs.sh

      - name: Fetch Clouds Nimbus DSP
        run: |
          git clone --depth 1 https://github.com/electro-smith/DaisyExamples DaisyExamples
          cp -R DaisyExamples/patch/Nimbus/dsp AuroraCloudscape/dsp
          cp DaisyExamples/patch/Nimbus/resources.cpp AuroraCloudscape/resources.cpp
          cp DaisyExamples/patch/Nimbus/resources.h AuroraCloudscape/resources.h
          cp DaisyExamples/patch/Nimbus/buffer_allocator.h AuroraCloudscape/buffer_allocator.h
          cp DaisyExamples/patch/Nimbus/parameter_interpolator.h AuroraCloudscape/parameter_interpolator.h
          cp DaisyExamples/patch/Nimbus/shy_fft.h AuroraCloudscape/shy_fft.h
          cp DaisyExamples/patch/Nimbus/stmtemp.h AuroraCloudscape/stmtemp.h
          # Aurora BOOT_SRAM leaves less DTCM headroom than Daisy Patch.
          # Keep the Clouds fast work buffer in Aurora's large AXI/D2 memory pool.
          sed -i 's/DTCMRAM uint8_t block_ccm/D2RAM uint8_t block_ccm/' AuroraCloudscape/AuroraCloudscape.cpp

      - name: Build Cloudscape
        working-directory: AuroraCloudscape
        run: make AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK"

      - name: Verify binary
        run: |
          test -s AuroraCloudscape/build/AuroraCloudscape.bin
          file AuroraCloudscape/build/AuroraCloudscape.bin
          ls -lh AuroraCloudscape/build/AuroraCloudscape.bin
          sha256sum AuroraCloudscape/build/AuroraCloudscape.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraCloudscape-firmware
          path: AuroraCloudscape/build/AuroraCloudscape.bin
          if-no-files-found: error
