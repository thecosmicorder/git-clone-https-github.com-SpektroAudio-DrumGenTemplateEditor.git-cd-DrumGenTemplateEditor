name: Build Aurora Cloudscape

on:
  push:
    branches: [ main ]
    paths:
      - 'AuroraCloudscape/**'
      - '.github/workflows/cloudscape.yml'
      - '.github/scripts/patch_cloudscape_v16.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git python3

      - name: Clone Aurora SDK
        run: |
          git clone https://github.com/Qu-Bit-Electronix/Aurora-SDK --recurse-submodules Aurora-SDK
          cd Aurora-SDK
          git submodule update --init --recursive
          ./ci/build_libs.sh

      - name: Apply v1.6 four-effect button routing
        run: python3 .github/scripts/patch_cloudscape_v16.py

      - name: Build Cloudscape
        working-directory: AuroraCloudscape
        run: make AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK"

      - name: Verify binary
        run: |
          test -s AuroraCloudscape/build/AuroraCloudscape.bin
          file AuroraCloudscape/build/AuroraCloudscape.bin
          ls -lh AuroraCloudscape/build/AuroraCloudscape.bin
          sha256sum AuroraCloudscape/build/AuroraCloudscape.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraCloudscape-v1.6-four-distinct-fx
          path: AuroraCloudscape/build/AuroraCloudscape.bin
          if-no-files-found: error
