name: Build Aurora Cosmic Debris v1.1

on:
  push:
    branches: [ main ]
    paths:
      - 'AuroraCosmicDebrisV11/**'
      - '.github/workflows/cosmic-debris-v11.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git

      - name: Clone Aurora SDK
        run: |
          git clone https://github.com/Qu-Bit-Electronix/Aurora-SDK --recurse-submodules Aurora-SDK
          cd Aurora-SDK
          git submodule update --init --recursive
          ./ci/build_libs.sh

      - name: Build Cosmic Debris v1.1
        working-directory: AuroraCosmicDebrisV11
        run: |
          make clean AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK" || true
          make AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK"

      - name: Verify binary
        run: |
          test -s AuroraCosmicDebrisV11/build/AuroraCosmicDebrisV11.bin
          ls -lh AuroraCosmicDebrisV11/build/AuroraCosmicDebrisV11.bin
          sha256sum AuroraCosmicDebrisV11/build/AuroraCosmicDebrisV11.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Cosmic-Debris-v1.1-POWER
          path: AuroraCosmicDebrisV11/build/AuroraCosmicDebrisV11.bin
          if-no-files-found: error
