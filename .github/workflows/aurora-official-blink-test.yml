name: Build Aurora Official Blink Test

on:
  push:
    branches: [ main ]
    paths:
      - 'AuroraOfficialBlinkTest/**'
      - '.github/workflows/aurora-official-blink-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git
      - name: Clone Aurora SDK
        run: |
          git clone https://github.com/Qu-Bit-Electronix/Aurora-SDK --recurse-submodules Aurora-SDK
          cd Aurora-SDK
          git submodule update --init --recursive
          ./ci/build_libs.sh
      - name: Build Blink Test
        working-directory: AuroraOfficialBlinkTest
        run: |
          make AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK"
          test -s build/AuroraOfficialBlinkTest.bin
      - name: Verify binary
        run: |
          ls -lh AuroraOfficialBlinkTest/build/AuroraOfficialBlinkTest.bin
          sha256sum AuroraOfficialBlinkTest/build/AuroraOfficialBlinkTest.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Official-Blink-Test
          path: AuroraOfficialBlinkTest/build/AuroraOfficialBlinkTest.bin
          if-no-files-found: error
