name: InspiratoR Windows VST3

on:
  push:
    branches: [ inspirator-native-build ]
    paths:
      - 'InspiratoR_Native/**'
      - '.github/workflows/inspirator-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Configure x64 Release
        shell: pwsh
        run: cmake -S InspiratoR_Native -B build-inspirator -G "Visual Studio 17 2022" -A x64

      - name: Build engine smoke test and VST3
        shell: pwsh
        run: cmake --build build-inspirator --config Release --target InspiratoEngineSmoke InspiratoR_VST3 --parallel

      - name: Run v3.11 engine regression suite
        shell: pwsh
        run: .\build-inspirator\Release\InspiratoEngineSmoke.exe

      - name: Stage Windows VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\Windows | Out-Null
          Copy-Item -Recurse -Force "build-inspirator\InspiratoR_artefacts\Release\VST3\InspiratoR.vst3" "dist\Windows\InspiratoR.vst3"

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: InspiratoR-Windows-x64-VST3
          path: dist/Windows/InspiratoR.vst3
          if-no-files-found: error
          retention-days: 30
