name: InspiratoR Windows VST3

on:
  push:
    branches: [ inspirator-native-build ]
    paths:
      - 'InspiratoR_Native/**'
      - '.github/workflows/inspirator-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-vst3:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Configure, build and test x64 Release
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          where cl
          cl 2>&1 | findstr /C:"Version"
          cmake -S InspiratoR_Native -B build-inspirator -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-inspirator --target InspiratoEngineSmoke InspiratoR_VST3 --parallel
          build-inspirator\InspiratoEngineSmoke.exe

      - name: Stage Windows VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\Windows | Out-Null
          Copy-Item -Recurse -Force "build-inspirator\InspiratoR_artefacts\Release\VST3\InspiratoR.vst3" "dist\Windows\InspiratoR.vst3"

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: InspiratoR-Windows-x64-VST3
          path: dist/Windows/InspiratoR.vst3
          if-no-files-found: error
          retention-days: 30
