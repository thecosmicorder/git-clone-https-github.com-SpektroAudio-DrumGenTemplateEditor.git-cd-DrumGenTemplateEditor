name: Build Aurora SuperSuite

on:
  push:
    branches: [ main ]
    paths:
      - 'AuroraSuperSuite/**'
      - '.github/workflows/supersuite.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git

      - name: Clone Aurora SDK
        run: |
          git clone https://github.com/Qu-Bit-Electronix/Aurora-SDK --recurse-submodules Aurora-SDK
          cd Aurora-SDK
          git submodule update --init --recursive
          ./ci/build_libs.sh

      - name: Build combined and standalone firmwares
        working-directory: AuroraSuperSuite
        run: |
          set -e
          mkdir -p ../super_artifacts

          build_one () {
            NAME="$1"
            STANDALONE="$2"
            ENGINE="$3"
            make clean AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK" TARGET="$NAME" SUPER_STANDALONE="$STANDALONE" SUPER_ENGINE="$ENGINE" || true
            make AURORA_SDK_PATH="$GITHUB_WORKSPACE/Aurora-SDK" TARGET="$NAME" SUPER_STANDALONE="$STANDALONE" SUPER_ENGINE="$ENGINE"
            test -s "build/$NAME.bin"
            cp "build/$NAME.bin" "../super_artifacts/$NAME.bin"
          }

          build_one AuroraSuperSuite 0 255
          build_one Aurora2OPFM      1 0
          build_one AuroraROOM       1 1
          build_one AuroraCHORUS     1 2
          build_one AuroraTVCA       1 3
          build_one AuroraEG         1 4
          build_one AuroraSVFs       1 5
          build_one AuroraSCANNER    1 6

      - name: Verify all binaries
        run: |
          set -e
          for f in super_artifacts/*.bin; do
            test -s "$f"
            file "$f"
            sha256sum "$f"
          done
          ls -lh super_artifacts/*.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-SuperSuite-v1.0-eight-firmwares
          path: super_artifacts/*.bin
          if-no-files-found: error
