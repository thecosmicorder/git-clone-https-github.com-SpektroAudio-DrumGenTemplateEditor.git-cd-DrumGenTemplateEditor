name: Build Myriad SAFE4 v4 Proven Screen

on:
  push:
    branches: [ myriad-safe4-build ]
    paths:
      - 'myriad-safe4/**'
      - '.github/workflows/myriad-safe4-v4-proven-screen.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MYRIAD_FQBN: rp2040:rp2040:generic:flash=16777216_14680064,freq=200,opt=Optimize3,os=none,profile=Disabled,rtti=Disabled,stackprotect=Disabled,exceptions=Disabled,dbgport=Disabled,dbglvl=None,boot2=boot2_w25q080_2_padded_checksum,usbstack=picosdk,ipbtstack=ipv4only,uploadmethod=default
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2

      - name: Install exact toolchain
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040@6.0.0
          arduino-cli lib install 'ArduinoJson@7.4.3'

      - name: Fetch clean official Myriad 1.1.2
        run: |
          git clone --depth 1 --branch 1.1.2 https://github.com/Emute-Lab-Instruments/Myriad.git Myriad
          test "$(grep -m1 '#define MYRIAD_VERSION' Myriad/Myriad_A/Myriad_A.ino)" = '#define MYRIAD_VERSION "1.1.2"'
          git -C Myriad rev-parse HEAD | tee MYRIAD_COMMIT.txt

      - name: Restore exact memlp commit and known 1.1.2 compatibility shim
        run: |
          rm -rf Myriad/Myriad_A/src/memlp
          git clone https://github.com/MusicallyEmbodiedML/memlp.git Myriad/Myriad_A/src/memlp
          git -C Myriad/Myriad_A/src/memlp checkout b5a63e8f70b22c0fcdcc4175ba8447ef91512d21
          test "$(git -C Myriad/Myriad_A/src/memlp rev-parse HEAD)" = 'b5a63e8f70b22c0fcdcc4175ba8447ef91512d21'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Myriad/Myriad_A/src/memlp/Utils.h')
          s=p.read_text()
          assert 'enum ACTIVATION_FUNCTIONS {SIGMOID, TANH, LINEAR, RELU};' in s
          s=s.replace('enum ACTIVATION_FUNCTIONS {SIGMOID, TANH, LINEAR, RELU};','enum ACTIVATION_FUNCTIONS {SIGMOID, TANH, LINEAR, RELU, HARDSIGMOID};')
          marker='//Compute hyperbolic tangent (tanh)\n'
          hard='''// Myriad 1.1.2 compatibility\ntemplate<typename T>\nMLP_ACTIVATION_FN\ninline T hardsigmoid(T x) {\n  T y = static_cast<T>(0.2) * x + static_cast<T>(0.5);\n  if (y < static_cast<T>(0)) return static_cast<T>(0);\n  if (y > static_cast<T>(1)) return static_cast<T>(1);\n  return y;\n}\n\ntemplate<typename T>\nMLP_ACTIVATION_FN\ninline T deriv_hardsigmoid(T x) {\n  return (x > static_cast<T>(-2.5) && x < static_cast<T>(2.5)) ? static_cast<T>(0.2) : static_cast<T>(0);\n}\n\n'''
          assert marker in s
          s=s.replace(marker,hard+marker)
          reg='    AddNewPair(ACTIVATION_FUNCTIONS::RELU, &relu<T>, &deriv_relu<T>);'
          assert reg in s
          s=s.replace(reg,reg+'\n    AddNewPair(ACTIVATION_FUNCTIONS::HARDSIGMOID, &hardsigmoid<T>, &deriv_hardsigmoid<T>);')
          p.write_text(s)
          PY

      - name: Install TFT_eSPI with hardware-proven Setup303
        run: |
          git clone https://github.com/Emute-Lab-Instruments/TFT_eSPI.git TFT_eSPI
          git -C TFT_eSPI rev-parse HEAD | tee TFT_ESPI_COMMIT.txt
          cat > TFT_eSPI/User_Setups/Setup303_RP2040_GC9A01.h <<'EOF'
          // Hardware-proven on user's Myriad A with stock 1.1.2 screen test
          #define USER_SETUP_ID 303
          #define GC9A01_DRIVER
          #define TFT_WIDTH 240
          #define TFT_HEIGHT 240
          #define TFT_MOSI 3
          #define TFT_SCLK 2
          #define TFT_CS   20
          #define TFT_DC   18
          #define TFT_RST  19
          #define TFT_BL   17
          #define TFT_BACKLIGHT_ON HIGH
          #define LOAD_GLCD
          #define LOAD_FONT2
          #define LOAD_FONT4
          #define LOAD_FONT6
          #define LOAD_FONT7
          #define LOAD_FONT8
          #define LOAD_GFXFF
          #define SMOOTH_FONT
          #define SPI_FREQUENCY 40000000
          #define SPI_READ_FREQUENCY 20000000
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TFT_eSPI/User_Setup_Select.h')
          s=p.read_text()
          line='#include <User_Setup.h>           // Default setup is root library folder'
          assert line in s
          s=s.replace(line,'//#include <User_Setup.h>           // Default setup is root library folder\n#include <User_Setups/Setup303_RP2040_GC9A01.h> // Myriad round TFT')
          p.write_text(s)
          PY
          grep -q '#define TFT_CS   20' TFT_eSPI/User_Setups/Setup303_RP2040_GC9A01.h
          grep -q '#define TFT_DC   18' TFT_eSPI/User_Setups/Setup303_RP2040_GC9A01.h
          grep -q '#define TFT_RST  19' TFT_eSPI/User_Setups/Setup303_RP2040_GC9A01.h
          grep -q '#define TFT_BL   17' TFT_eSPI/User_Setups/Setup303_RP2040_GC9A01.h

      - name: Install Arduino libraries
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          ln -s "$GITHUB_WORKSPACE/Myriad/arduino_libmyriad" "$HOME/Arduino/libraries/arduino_libmyriad"
          ln -s "$GITHUB_WORKSPACE/TFT_eSPI" "$HOME/Arduino/libraries/TFT_eSPI"

      - name: Apply hardened SAFE4 patch
        run: |
          python3 myriad-safe4/prepare_safe4.py
          test "$(grep -m1 '#define MYRIAD_VERSION' Myriad/Myriad_A/Myriad_A.ino)" = '#define MYRIAD_VERSION "1.1.2-SAFE4"'
          grep -q 'N_OSCILLATOR_MODELS = 17;' Myriad/arduino_libmyriad/oscillatorModels.hpp

      - name: Preflight failure-mode audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          a=Path('Myriad/Myriad_A/Myriad_A.ino').read_text()
          b=Path('Myriad/Myriad_B/Myriad_B.ino').read_text()
          h=Path('Myriad/arduino_libmyriad/oscmodels/safe4OscillatorModels.hpp').read_text()
          d=Path('Myriad/Myriad_A/displayPortal.h').read_text()
          om=Path('Myriad/arduino_libmyriad/oscillatorModels.hpp').read_text()
          assert 'N_OSCILLATOR_MODELS = 17;' in om
          assert '28' not in re.search(r'N_OSCILLATOR_MODELS\s*=\s*\d+',om).group(0)
          for idx in range(17):
              assert f'allOscModels[{idx}][i]' in a, f'A model {idx} not explicitly registered'
              assert f'allOscModels0[{idx}][i]' in b, f'B0 model {idx} not explicitly registered'
              assert f'allOscModels1[{idx}][i]' in b, f'B1 model {idx} not explicitly registered'
          assert 'if(oscBankTypes[i]>=N_OSCILLATOR_MODELS) oscBankTypes[i]=0;' in a
          active_saves=[ln.strip() for ln in a.splitlines() if 'MyriadState::setOscBank(' in ln and not ln.lstrip().startswith('//')]
          assert active_saves == ['MyriadState::setOscBank(i, oscBankTypes[i] < 13 ? oscBankTypes[i] : 0);'], active_saves
          assert 'iconDrawFunctions.find(oscModelIDs[model])' in d
          for ident in ('A_sine','B_fold','C_fm','D_vowel'):
              assert ident in h
          assert 'new ' not in h and 'malloc' not in h and 'calloc' not in h
          assert 'wavelen > 0' in h
          assert 'safe4PureSineModel' not in Path('Myriad/arduino_libmyriad/oscmodels/silentOscillatorModel.hpp').read_text()
          print('SAFE4 preflight source audit: PASS')
          PY

      - name: Compile SAFE4 A
        run: |
          mkdir -p out-A
          arduino-cli compile --clean --fqbn "$MYRIAD_FQBN" --output-dir "$GITHUB_WORKSPACE/out-A" Myriad/Myriad_A 2>&1 | tee out-A/compile.log
          test -s out-A/Myriad_A.ino.uf2
          cp out-A/Myriad_A.ino.uf2 out-A/Myriad_A_SAFE4_v4.uf2
          sha256sum out-A/Myriad_A_SAFE4_v4.uf2 | tee out-A/SHA256.txt
          grep -E 'Sketch uses|Global variables use' out-A/compile.log | tee out-A/MEMORY.txt || true

      - name: Compile SAFE4 B
        run: |
          mkdir -p out-B
          arduino-cli compile --clean --fqbn "$MYRIAD_FQBN" --output-dir "$GITHUB_WORKSPACE/out-B" Myriad/Myriad_B 2>&1 | tee out-B/compile.log
          test -s out-B/Myriad_B.ino.uf2
          cp out-B/Myriad_B.ino.uf2 out-B/Myriad_B_SAFE4_v4.uf2
          sha256sum out-B/Myriad_B_SAFE4_v4.uf2 | tee out-B/SHA256.txt
          grep -E 'Sketch uses|Global variables use' out-B/compile.log | tee out-B/MEMORY.txt || true

      - name: Final memory and UF2 sanity gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for board in ('A','B'):
              log=Path(f'out-{board}/compile.log').read_text(errors='ignore')
              m=re.search(r'Global variables use (\d+) bytes \((\d+)%\)',log)
              assert m, f'No RAM report for {board}'
              used,pct=map(int,m.groups())
              print(board,'RAM',used,'bytes',pct,'%')
              assert pct < 75, f'{board} RAM too high: {pct}%'
              uf=Path(f'out-{board}/Myriad_{board}_SAFE4_v4.uf2')
              assert uf.stat().st_size > 100000
          PY

      - name: Write test manifest
        run: |
          {
            echo 'MYRIAD SAFE4 v4 - FIRST HARDWARE OSCILLATOR TEST'
            echo 'Base: official Myriad 1.1.2'
            echo 'TFT configuration: same mapping that passed stock-A hardware screen test'
            echo 'New models: 13 Pure Sine, 14 Wavefolder, 15 FM Morph, 16 Vowel Morph'
            echo 'Explicit registration only; old 28-model constructor hook absent'
            echo 'Experimental indices 13-16 are not persisted to stock preset state'
            echo 'Compile/preflight passed; actual SAFE4 oscillator behavior is not hardware-proven yet'
            echo
            echo 'A:'; cat out-A/SHA256.txt; cat out-A/MEMORY.txt
            echo 'B:'; cat out-B/SHA256.txt; cat out-B/MEMORY.txt
          } | tee TEST_MANIFEST.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Myriad-SAFE4-v4-proven-screen
          path: |
            out-A/Myriad_A_SAFE4_v4.uf2
            out-B/Myriad_B_SAFE4_v4.uf2
            out-A/SHA256.txt
            out-B/SHA256.txt
            out-A/MEMORY.txt
            out-B/MEMORY.txt
            out-A/compile.log
            out-B/compile.log
            TFT_eSPI/User_Setups/Setup303_RP2040_GC9A01.h
            TEST_MANIFEST.txt
            MYRIAD_COMMIT.txt
            TFT_ESPI_COMMIT.txt
          if-no-files-found: error
